name: XAUUSD levels every 15 minutes

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xauusd-levels-15m
  cancel-in-progress: true

jobs:
  update-levels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests openai

      - name: Generate XAUUSD levels
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}
        run: python scripts/xau_levels_15m.py

      - name: Commit updated levels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add levels.txt levels_history.log
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update XAUUSD 15m levels"
          git push

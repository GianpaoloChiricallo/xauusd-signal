name: XAUUSD levels every 15 minutes

on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * 1-5'

permissions:
  contents: write

concurrency:
  group: xauusd-levels-15m
  cancel-in-progress: true

jobs:
  update-levels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests openai

      - name: Generate XAUUSD levels
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}
        run: python scripts/xau_levels_15m.py

      - name: Commit updated levels
        run: |
          if git diff --quiet -- levels.txt levels_history.log; then
            echo "No changes"
            exit 0
          fi
          git config user.name "xauusd-levels-bot"
          git config user.email "xauusd-levels-bot@users.noreply.github.com"
          git add levels.txt levels_history.log
          git commit -m "Update XAUUSD M15 levels"
          git push
